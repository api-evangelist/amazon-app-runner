security:
- hmac: []
tags:
- name: Amazon App Runner AWS App Runner API
paths:
  /:
    post:
      operationId: CreateService
      summary: Amazon App Runner Create an App Runner service
      description: Creates an App Runner service from a source code repository or container image.
      tags:
      - Amazon App Runner AWS App Runner API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceInput'
      responses:
        '200':
          description: Service created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceOutput'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
components:
  schemas:
    CreateServiceOutput:
      type: object
      properties:
        Service:
          type: object
          properties:
            ServiceName:
              type: string
            ServiceArn:
              type: string
            Status:
              type: string
        OperationId:
          type: string
    CreateServiceInput:
      type: object
      required:
      - ServiceName
      - SourceConfiguration
      properties:
        ServiceName:
          type: string
          description: The name of the App Runner service
        SourceConfiguration:
          type: object
          description: The source configuration for the service
        InstanceConfiguration:
          type: object
          description: Instance configuration (CPU, memory)
        AutoScalingConfigurationArn:
          type: string
        HealthCheckConfiguration:
          type: object
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/apprunner/
x-hasEquivalentPaths: true
