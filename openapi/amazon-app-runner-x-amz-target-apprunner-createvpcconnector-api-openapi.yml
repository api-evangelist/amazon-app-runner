security:
- hmac: []
tags:
- name: '#X Amz Target=AppRunner.CreateVpcConnector'
paths:
  /#X-Amz-Target=AppRunner.CreateVpcConnector:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateVpcConnector
      description: Create an App Runner VPC connector resource. App Runner requires this resource when you want to associate your App Runner service to a custom Amazon Virtual Private Cloud (Amazon VPC).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVpcConnectorResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: InternalServiceErrorException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceErrorException'
        '482':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVpcConnectorRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - AppRunner.CreateVpcConnector
      tags:
      - '#X Amz Target=AppRunner.CreateVpcConnector'
components:
  schemas:
    VpcConnectorName:
      type: string
      pattern: '[A-Za-z0-9][A-Za-z0-9\-_]{3,39}'
      minLength: 4
      maxLength: 40
    InternalServiceErrorException: {}
    CreateVpcConnectorResponse:
      type: object
      required:
      - VpcConnector
      properties:
        VpcConnector:
          allOf:
          - $ref: '#/components/schemas/VpcConnector'
          - description: A description of the App Runner VPC connector that's created by this request.
    StringList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    AppRunnerResourceArn:
      type: string
      pattern: arn:aws(-[\w]+)*:[a-z0-9-\\.]{0,63}:[a-z0-9-\\.]{0,63}:[0-9]{12}:(\w|\/|-){1,1011}
      minLength: 1
      maxLength: 1011
    Timestamp:
      type: string
      format: date-time
    Tag:
      type: object
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key of the tag.
        Value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value of the tag.
      description: Describes a tag that is applied to an App Runner resource. A tag is a metadata item consisting of a key-value pair.
    ServiceQuotaExceededException: {}
    TagKey:
      type: string
      pattern: ^(?!aws:).+
      minLength: 1
      maxLength: 128
    VpcConnector:
      type: object
      properties:
        VpcConnectorName:
          allOf:
          - $ref: '#/components/schemas/VpcConnectorName'
          - description: The customer-provided VPC connector name.
        VpcConnectorArn:
          allOf:
          - $ref: '#/components/schemas/AppRunnerResourceArn'
          - description: The Amazon Resource Name (ARN) of this VPC connector.
        VpcConnectorRevision:
          allOf:
          - $ref: '#/components/schemas/Integer'
          - description: '<p>The revision of this VPC connector. It''s unique among all the active connectors (<code>"Status": "ACTIVE"</code>) that share the same <code>Name</code>.</p> <note> <p>At this time, App Runner supports only one revision per name.</p> </note>'
        Subnets:
          allOf:
          - $ref: '#/components/schemas/StringList'
          - description: A list of IDs of subnets that App Runner uses for your service. All IDs are of subnets of a single Amazon VPC.
        SecurityGroups:
          allOf:
          - $ref: '#/components/schemas/StringList'
          - description: A list of IDs of security groups that App Runner uses for access to Amazon Web Services resources under the specified subnets. If not specified, App Runner uses the default security group of the Amazon VPC. The default security group allows all outbound traffic.
        Status:
          allOf:
          - $ref: '#/components/schemas/VpcConnectorStatus'
          - description: The current state of the VPC connector. If the status of a connector revision is <code>INACTIVE</code>, it was deleted and can't be used. Inactive connector revisions are permanently removed some time after they are deleted.
        CreatedAt:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time when the VPC connector was created. It's in Unix time stamp format.
        DeletedAt:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time when the VPC connector was deleted. It's in Unix time stamp format.
      description: <p>Describes an App Runner VPC connector resource. A VPC connector describes the Amazon Virtual Private Cloud (Amazon VPC) that an App Runner service is associated with, and the subnets and security group that are used.</p> <p>Multiple revisions of a connector might have the same <code>Name</code> and different <code>Revision</code> values.</p> <note> <p>At this time, App Runner supports only one revision per name.</p> </note>
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    VpcConnectorStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    TagValue:
      type: string
      pattern: .*
      minLength: 0
      maxLength: 256
    InvalidRequestException: {}
    CreateVpcConnectorRequest:
      type: object
      required:
      - VpcConnectorName
      - Subnets
      title: CreateVpcConnectorRequest
      properties:
        VpcConnectorName:
          allOf:
          - $ref: '#/components/schemas/VpcConnectorName'
          - description: A name for the VPC connector.
        Subnets:
          allOf:
          - $ref: '#/components/schemas/StringList'
          - description: <p>A list of IDs of subnets that App Runner should use when it associates your service with a custom Amazon VPC. Specify IDs of subnets of a single Amazon VPC. App Runner determines the Amazon VPC from the subnets you specify.</p> <note> <p> App Runner currently only provides support for IPv4. </p> </note>
        SecurityGroups:
          allOf:
          - $ref: '#/components/schemas/StringList'
          - description: A list of IDs of security groups that App Runner should use for access to Amazon Web Services resources under the specified subnets. If not specified, App Runner uses the default security group of the Amazon VPC. The default security group allows all outbound traffic.
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: A list of metadata items that you can associate with your VPC connector resource. A tag is a key-value pair.
    Integer:
      type: integer
    String:
      type: string
      pattern: .*
      minLength: 0
      maxLength: 51200
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
